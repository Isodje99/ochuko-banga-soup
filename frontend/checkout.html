<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Ochuko Banga Soup</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <!-- Navigation -->

    <header>

        <div class="logo">
            🍲 Ochuko Banga Soup
        </div>

        <nav>

            <a href="index.html">Home</a>

            <a href="index.html#menu">Menu</a>

            <a href="cart.html">Cart</a>

        </nav>

    </header>



    <!-- Checkout -->

    <main class="checkout-page">

        <div class="section-title">

            <p>CHECKOUT</p>

            <h2>Complete Your Order</h2>

        </div>



        <div class="checkout-container">


            <!-- Customer Information -->

            <div class="checkout-form">

                <h3>Delivery Information</h3>


                <form id="checkout-form">


                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >



                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="08012345678"
                        required
                    >



                    <label for="address">
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your complete delivery address"
                        required
                    ></textarea>



                    <label for="city">
                        City
                    </label>

                    <input
                        type="text"
                        id="city"
                        placeholder="Enter your city"
                        required
                    >



                    <label for="note">
                        Order Note
                    </label>

                    <textarea
                        id="note"
                        placeholder="Any special instruction? (Optional)"
                    ></textarea>



                    <h3 class="payment-heading">
                        Payment Method
                    </h3>


                    <div class="payment-option">

                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="online"
                                checked
                            >

                            Pay Online

                        </label>
<div id="card-details" style="display: none;">

    <input
        type="text"
        id="cardName"
        placeholder="Cardholder Name"
    >

    <input
        type="text"
        id="cardNumber"
        placeholder="Card Number"
        maxlength="19"
    >

</div>

                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="cash"
                            >

                            Cash on Delivery

                        </label>

                    </div>



                    <button
                        type="submit"
                        class="place-order-btn"
                    >

                        Place Order

                    </button>


                </form>

            </div>



            <!-- Order Summary -->

            <div class="checkout-summary">

                <h3>Your Order</h3>


                <div id="checkout-items">

                    <!-- JavaScript adds items here -->

                </div>


                <hr>


                <div class="summary-row">

                    <span>Subtotal</span>

                    <strong id="checkout-subtotal">
                        ₦0
                    </strong>

                </div>


                <div class="summary-row">

                    <span>Delivery</span>

                    <strong>
                        ₦1,000
                    </strong>

                </div>


                <div class="summary-row total">

                    <span>Total</span>

                    <strong id="checkout-total">
                        ₦0
                    </strong>

                </div>

            </div>

        </div>

    </main>



    <footer>

        <p>
            © 2026 Ochuko Banga Soup.
            All Rights Reserved.
        </p>

    </footer>



    <script src="js/checkout.js"></script>

</body>

</html>
